name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Build Verification
    needs: [typecheck, lint, test]
    if: always() && (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: cd artifacts/yt-history && pnpm install
      - run: cd artifacts/yt-history && pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tubetrace
          path: artifacts/yt-history/dist/
          retention-days: 5
